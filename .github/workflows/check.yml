name: Check and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: matrix.os != 'windows-latest'
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "MoonBit installation attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: matrix.os == 'windows-latest'
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain and dependencies
        run: |
          moon version --all
          moon update

      - name: Enforce minimum Moonc version on Unix
        if: matrix.os != 'windows-latest'
        run: |
          version="$(moon version --all | sed -n 's/^moonc v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "$version" ]; then
            echo "Unable to determine Moonc version."
            exit 1
          fi
          echo "Moonc $version"
          if ! printf '%s\n' "$version" | awk -F. '{ score=($1+0)*1000000+($2+0)*1000+($3+0); exit score < 10009 }'; then
            echo "Moonc $version is older than the required v0.10.9."
            exit 1
          fi

      - name: Enforce minimum Moonc version on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $line = moon version --all | Select-String '^moonc v'
          if (-not $line) {
            throw 'Unable to determine Moonc version.'
          }
          $match = [regex]::Match($line.ToString(), 'moonc v([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) {
            throw 'Unable to parse Moonc version.'
          }
          $parts = $match.Groups[1].Value.Split('.') | ForEach-Object { [int]$_ }
          $score = $parts[0] * 1000000 + $parts[1] * 1000 + $parts[2]
          Write-Output "Moonc $($match.Groups[1].Value)"
          if ($score -lt 10009) {
            throw "Moonc $($match.Groups[1].Value) is older than the required v0.10.9."
          }

      - name: Check formatting
        run: moon fmt --check

      - name: Typecheck all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
