name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Mooncakes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "MoonBit installation attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify package
        run: |
          moon version --all
          moon update
          version="$(moon version --all | sed -n 's/^moonc v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "$version" ]; then
            echo "Unable to determine Moonc version."
            exit 1
          fi
          if ! printf '%s\n' "$version" | awk -F. '{ score=($1+0)*1000000+($2+0)*1000+($3+0); exit score < 10009 }'; then
            echo "Moonc $version is older than the required v0.10.9."
            exit 1
          fi
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon fmt --check

      - name: Publish package
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        run: |
          if [ -z "$MOONCAKES_CREDENTIALS_JSON" ]; then
            echo "MOONCAKES_CREDENTIALS_JSON is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > "$HOME/.moon/credentials.json"
          moon publish --frozen
          rm -f "$HOME/.moon/credentials.json"
